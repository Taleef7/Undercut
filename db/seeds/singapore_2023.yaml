- id: "singapore_2023_lap40"
  session_id: "R"
  driver_id: "ALO"
  lap_number: 40
  decision_type: "extend_to_end"
  scenario_title: "Defend on Dead Tires — Alonso's Gamble"
  scenario_description: |
    Lap 40 of the 2023 Singapore GP. You're Fernando Alonso in P8 on hard
    tires that are 20 laps old. Perez just pitted for fresh mediums and is
    closing fast behind you. 22 laps to go at Marina Bay where overtaking is
    nearly impossible. Do you pit and concede position, or extend the stint
    and pray the tires hold?
  available_actions:
    - "pit_medium"
    - "stay_out_defend"
    - "ask_team_for_gap"
  actual_decision: "pit_medium"
  actual_outcome_summary: "Alonso pitted, rejoined P8, held position to the end"
  explanation_short: "The hards were past their window — pitting was the only logical call"
  explanation_long: |
    Alonso's Aston Martin made the right call to pit for mediums. The hard
    compound at Singapore was well past its optimal window after 20 laps,
    and lap times were deteriorating. Staying out would have meant being
    a sitting duck for Perez on fresh tires. While the pit stop cost track
    position, it preserved points and prevented a costly defense that would
    have destroyed the tires completely.
  race_state:
    current_position: 8
    gap_ahead_seconds: 2.5
    gap_behind_seconds: 1.8
    compound: "hard"
    stint_age_laps: 20
    laps_remaining: 22
    track_temperature_c: 35
    air_temperature_c: 29
    rainfall: false
    track_status: "green"
    safety_car_active: false
    virtual_safety_car_active: false

- id: "singapore_2023_lap43"
