- id: "singapore_2023_lap20"
  session_id: "R"
  driver_id: "RUS"
  lap_number: 20
  decision_type: "safety_car_pit"
  scenario_title: "The Rain Gamble — Safety Car at Marina Bay"
  scenario_description: |
    Lap 20. The safety car is deployed for track surface issues. You're George
    Russell in P3 on medium tires, 20 laps old. Some drivers are pitting for
    fresh rubber. The track is tricky but drying. Mercedes asks: pit for fresh
    hards under this SC, or stay out and maintain track position?
  available_actions:
    - "pit_hards"
    - "stay_out"
    - "wait_one_lap"
  actual_decision: "pit_hards"
  actual_outcome_summary: "Russell pitted for hards, rejoined P3, eventually won the race"
  explanation_short: "Free pit stop under SC — track position was preserved"
  explanation_long: |
    Russell's decision to pit under the safety car was the correct strategic
    call. At Singapore, a pit stop costs 22+ seconds, but under the safety car
    the field is bunched and the effective loss is minimal. Russell maintained
    P3 and gained fresher tires for the long stint ahead. This stop set up
    his race-winning strategy as others struggled with tire degradation later.
  race_state:
    current_position: 3
    gap_ahead_seconds: 3.0
    gap_behind_seconds: 2.0
    compound: "medium"
    stint_age_laps: 20
    laps_remaining: 42
    track_temperature_c: 35
    air_temperature_c: 29
    rainfall: false
    track_status: "safety_car"
    safety_car_active: true
    virtual_safety_car_active: false
