  driver_id: "NOR"
  lap_number: 43
  decision_type: "pit_now_vs_stay_out"
  scenario_title: "Norris's Window — Pit for Fastest Lap?"
  scenario_description: |
    Lap 43. You're Lando Norris in P3 on hard tires, 23 laps old. Sainz leads
    by 8 seconds. Russell is 12 seconds behind in P4. McLaren asks: pit for
    fresh softs to hunt fastest lap and risk P3, or stay out and consolidate?
  available_actions:
    - "pit_softs_fastest_lap"
    - "stay_out_consolidate"
  actual_decision: "stay_out_consolidate"
  actual_outcome_summary: "Norris stayed out, finished P2 after Russell retired"
  explanation_short: "P3 was secure — no need to risk everything for a fastest lap"
  explanation_long: |
    With a comfortable gap to P4 and 19 laps remaining, Norris's podium was
    never under threat. A pit stop at Singapore costs 22+ seconds, meaning
    he would have needed to make up the gap AND set a fastest lap on a track
    where overtaking is nearly impossible. The conservative call preserved
    a solid result in a race where McLaren had strong pace.
  race_state:
