  decision_type: "cover_undercut"
  scenario_title: "The Rear Gunner — Perez Holds the Line"
  scenario_description: |
    Lap 14. You're Sergio Perez in P2 on soft tires, 14 laps old. Hamilton
    leads on mediums. Your teammate Verstappen is behind in P4 after an early
    stop for hards. Verstappen is catching fast. Do you push to maintain gap
    to Hamilton, or pit early to cover Max's strategy?
  available_actions:
    - "pit_cover"
    - "push_stay_out"
    - "back_off"
  actual_decision: "push_stay_out"
  actual_outcome_summary: "Perez held up Hamilton for 10 laps, allowing VER to close from 9s to nothing"
  explanation_short: "Perez's defense was crucial — he sacrificed his race for the team's championship"
  explanation_long: |
    Perez chose to stay out and defend against Hamilton rather than pitting
    for fresh tires. Over the next 10 laps, he backed Hamilton into Verstappen
    with masterful defensive driving, cutting a 9-second gap to zero. This
    strategic sacrifice — giving up his own race position — was the unsung
    hero moment that set up the dramatic finale. Without Perez's defense,
    Hamilton would have built an unassailable lead.
