- id: "abu_dhabi_2021_lap56"
  session_id: "R"
  driver_id: "HAM"
  lap_number: 56
  decision_type: "defend_position"
  scenario_title: "Defend the Lead — One Lap for the Title"
  scenario_description: |
    Lap 56. The safety car is in this lap. You're Hamilton leading the race
    and the World Championship, but Verstappen is behind you on brand new soft
    tires. Your hard tires are 42 laps old. One lap shootout for everything.
    How do you defend?
  available_actions:
    - "defend_aggressive"
    - "defend_clean"
    - "concede_position"
  actual_decision: "defend_clean"
  actual_outcome_summary: "HAM defended cleanly but was overtaken at Turn 5, finished P2, lost WDC"
  explanation_short: "With 42-lap hards vs fresh softs, defense was nearly impossible"
  explanation_long: |
    Mercedes kept Hamilton out during the safety car, gambling that the race
    would finish under yellows. When the race director allowed lapped cars to
    pass and restart, Hamilton faced an impossible task. His 42-lap hard tires
    had no temperature or grip against Verstappen's new softs. Even aggressive
    weaving on the formation lap couldn't generate enough heat. A legendary
    season ended in heartbreak.
