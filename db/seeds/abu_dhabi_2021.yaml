  scenario_title: "Safety Car Gamble — The Championship on the Line"
  scenario_description: |
    Lap 53 of the 2021 Abu Dhabi GP. Latifi crashed, the safety car is deployed.
    You're Verstappen in P2, 5 laps to go. Hamilton leads on 43-lap-old hard tires.
    You have 17-lap-old hards. Red Bull asks: pit for fresh softs and surrender P2,
    or stay out and hope the race finishes under SC?
  available_actions:
    - "pit_softs"
    - "stay_out"
  actual_decision: "pit_softs"
  actual_outcome_summary: "VER pitted for softs, lapped cars allowed through, passed HAM on final lap to win WDC"
  explanation_short: "The gamble of the century — fresh softs vs 43-lap hards on a one-lap restart"
  explanation_long: |
    Red Bull rolled the dice. Pitting from P2 meant Verstappen would restart
    directly behind Hamilton, but on tires that were 40+ laps fresher. The
    controversial decision to allow only select lapped cars through created
    a one-lap shootout. Verstappen's soft tires gave him the grip to draft
    Hamilton down the back straight and pass into Turn 5, winning his first
    World Championship in the most dramatic finish in F1 history.
