- id: "hungary_2022_lap38"
  session_id: "R"
  driver_id: "SAI"
  lap_number: 38
  decision_type: "pit_now_vs_stay_out"
  scenario_title: "Ferrari's Strategy Blunder — Sainz at the Hungaroring"
  scenario_description: |
    Lap 38 of the 2022 Hungarian GP. You're Carlos Sainz in P3 on medium
    tires, 21 laps old. Leclerc leads on 21-lap mediums. Russell is P2.
    Ferrari asks you to pit for fresh hard tires with 32 laps to go.
    Do you pit and concede track position, or stay out and extend?
  available_actions:
    - "pit_hard"
    - "stay_out_extend"
    - "ask_for_undercut"
  actual_decision: "pit_hard"
  actual_outcome_summary: "Sainz pitted, rejoined P4, stuck behind slower cars, finished P4"
  explanation_short: "Ferrari's call was too conservative — track position was more valuable at Hungary"
  explanation_long: |
    Ferrari's decision to pit Sainz from P3 was widely criticized as overly
    conservative. With 32 laps remaining, the hard tire was marginal on a
    one-stop strategy, and the time lost in pit lane (20+ seconds) was never
    recovered at the Hungaroring where overtaking is difficult. Leclerc and
    Russell both stayed out longer and maintained position. Sainz's pace on
    fresh hards was strong but he was trapped behind slower cars, unable to
    make progress.
  race_state:
